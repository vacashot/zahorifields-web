<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Infografía CWSI — Índice de Estrés Hídrico con ZahoriFields</title>
  <desc>Diagrama explicativo del cálculo del CWSI a partir de imágenes térmicas de dron</desc>

  <defs>
    <linearGradient id="thermalGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2563EB"/>
      <stop offset="33%"  stop-color="#22C55E"/>
      <stop offset="66%"  stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0F1F1A"/>
      <stop offset="100%" stop-color="#0A1A15"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="520" fill="url(#bgGrad)" rx="12"/>
  <rect width="800" height="520" fill="none" stroke="#1E3B30" stroke-width="1.5" rx="12"/>

  <text x="400" y="42" text-anchor="middle" fill="#A3C4A0" font-size="11" letter-spacing="3" font-weight="500">ÍNDICE DE ESTRÉS HÍDRICO DEL CULTIVO</text>
  <text x="400" y="72" text-anchor="middle" fill="#E8F5E2" font-size="28" font-weight="700" letter-spacing="1">CWSI</text>
  <text x="400" y="92" text-anchor="middle" fill="#5A8A70" font-size="11" letter-spacing="2">Crop Water Stress Index · Imágenes térmicas de dron</text>

  <line x1="60" y1="108" x2="740" y2="108" stroke="#1E3B30" stroke-width="1"/>

  <rect x="60" y="122" width="300" height="120" rx="8" fill="#0D2820" stroke="#1E3B30" stroke-width="1"/>
  <text x="210" y="145" text-anchor="middle" fill="#5A8A70" font-size="10" letter-spacing="2">FÓRMULA</text>
  <text x="210" y="182" text-anchor="middle" fill="#E8F5E2" font-size="16" font-family="Georgia, serif" font-style="italic">T<tspan font-size="11" dy="4">foliar</tspan><tspan dy="-4"> − T</tspan><tspan font-size="11" dy="4">húmeda</tspan></text>
  <line x1="110" y1="192" x2="310" y2="192" stroke="#22C55E" stroke-width="1.5"/>
  <text x="210" y="214" text-anchor="middle" fill="#E8F5E2" font-size="16" font-family="Georgia, serif" font-style="italic">T<tspan font-size="11" dy="4">seca</tspan><tspan dy="-4"> − T</tspan><tspan font-size="11" dy="4">húmeda</tspan></text>
  <text x="78" y="188" fill="#22C55E" font-size="20" font-weight="700" font-family="Georgia, serif" font-style="italic">CWSI =</text>
  <text x="75" y="232" fill="#5A8A70" font-size="9.5">T<tspan font-size="7.5" dy="2">foliar</tspan><tspan dy="-2"> = temperatura media del dosel</tspan></text>
  <text x="75" y="246" fill="#5A8A70" font-size="9.5">T<tspan font-size="7.5" dy="2">húmeda</tspan><tspan dy="-2"> = planta sin estrés (bien regada)</tspan></text>
  <text x="75" y="260" fill="#5A8A70" font-size="9.5">T<tspan font-size="7.5" dy="2">seca</tspan><tspan dy="-2"> = planta con estrés máximo (PMP)</tspan></text>

  <rect x="60" y="260" width="300" height="100" rx="8" fill="#0D2820" stroke="#1E3B30" stroke-width="1"/>
  <text x="210" y="283" text-anchor="middle" fill="#5A8A70" font-size="10" letter-spacing="2">ESCALA DE VALORES</text>
  <rect x="80" y="292" width="260" height="22" rx="4" fill="url(#thermalGrad)"/>
  <text x="80"  y="330" fill="#2563EB" font-size="10" text-anchor="middle">0</text>
  <text x="145" y="330" fill="#22C55E" font-size="10" text-anchor="middle">0.25</text>
  <text x="210" y="330" fill="#EAB308" font-size="10" text-anchor="middle">0.5</text>
  <text x="275" y="330" fill="#F97316" font-size="10" text-anchor="middle">0.75</text>
  <text x="340" y="330" fill="#EF4444" font-size="10" text-anchor="middle">1</text>
  <text x="80"  y="348" fill="#3B82F6" font-size="9" text-anchor="middle">Sin estrés</text>
  <text x="210" y="348" fill="#EAB308" font-size="9" text-anchor="middle">Estrés moderado</text>
  <text x="340" y="348" fill="#EF4444" font-size="9" text-anchor="middle">Estrés máximo</text>

  <rect x="390" y="122" width="350" height="238" rx="8" fill="#0D2820" stroke="#1E3B30" stroke-width="1"/>
  <text x="565" y="145" text-anchor="middle" fill="#5A8A70" font-size="10" letter-spacing="2">MAPA TÉRMICO DE PARCELA (DRON)</text>

  <rect x="415" y="158" width="75" height="60" rx="3" fill="#1D3A8A" opacity="0.85"/>
  <text x="452" y="183" text-anchor="middle" fill="#93C5FD" font-size="9" font-weight="600">CWSI</text>
  <text x="452" y="197" text-anchor="middle" fill="#BFDBFE" font-size="11" font-weight="700">0.12</text>
  <text x="452" y="210" text-anchor="middle" fill="#93C5FD" font-size="8">Sin estrés</text>

