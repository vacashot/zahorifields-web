  <text x="120" y="455" text-anchor="middle" fill="#A3C4A0" font-size="9">Carga</text>
  <text x="120" y="467" text-anchor="middle" fill="#A3C4A0" font-size="9">GeoTIFF</text>
  <text x="120" y="479" text-anchor="middle" fill="#A3C4A0" font-size="9">térmico</text>

  <line x1="140" y1="430" x2="220" y2="430" stroke="#1E3B30" stroke-width="1" stroke-dasharray="4,3"/>

  <circle cx="240" cy="430" r="14" fill="#0A3020" stroke="#22C55E" stroke-width="1.2"/>
  <text x="240" y="435" text-anchor="middle" fill="#22C55E" font-size="12" font-weight="700">2</text>
  <text x="240" y="455" text-anchor="middle" fill="#A3C4A0" font-size="9">Introduce</text>
  <text x="240" y="467" text-anchor="middle" fill="#A3C4A0" font-size="9">T seca y</text>
  <text x="240" y="479" text-anchor="middle" fill="#A3C4A0" font-size="9">T húmeda</text>

  <line x1="260" y1="430" x2="340" y2="430" stroke="#1E3B30" stroke-width="1" stroke-dasharray="4,3"/>

  <circle cx="360" cy="430" r="14" fill="#0A3020" stroke="#22C55E" stroke-width="1.2"/>
  <text x="360" y="435" text-anchor="middle" fill="#22C55E" font-size="12" font-weight="700">3</text>
  <text x="360" y="455" text-anchor="middle" fill="#A3C4A0" font-size="9">Activa</text>
  <text x="360" y="467" text-anchor="middle" fill="#A3C4A0" font-size="9">módulo</text>
  <text x="360" y="479" text-anchor="middle" fill="#A3C4A0" font-size="9">CWSI</text>

  <line x1="380" y1="430" x2="460" y2="430" stroke="#1E3B30" stroke-width="1" stroke-dasharray="4,3"/>

  <circle cx="480" cy="430" r="14" fill="#0A3020" stroke="#22C55E" stroke-width="1.2"/>
  <text x="480" y="435" text-anchor="middle" fill="#22C55E" font-size="12" font-weight="700">4</text>
  <text x="480" y="455" text-anchor="middle" fill="#A3C4A0" font-size="9">Define</text>
  <text x="480" y="467" text-anchor="middle" fill="#A3C4A0" font-size="9">zonas</text>
  <text x="480" y="479" text-anchor="middle" fill="#A3C4A0" font-size="9">AOI</text>

  <line x1="500" y1="430" x2="580" y2="430" stroke="#1E3B30" stroke-width="1" stroke-dasharray="4,3"/>

  <circle cx="600" cy="430" r="14" fill="#0A3020" stroke="#22C55E" stroke-width="1.2"/>
  <text x="600" y="435" text-anchor="middle" fill="#22C55E" font-size="12" font-weight="700">5</text>
  <text x="600" y="455" text-anchor="middle" fill="#A3C4A0" font-size="9">Mapa</text>
  <text x="600" y="467" text-anchor="middle" fill="#A3C4A0" font-size="9">CWSI +</text>
  <text x="600" y="479" text-anchor="middle" fill="#A3C4A0" font-size="9">estadísticas</text>

  <line x1="620" y1="430" x2="700" y2="430" stroke="#1E3B30" stroke-width="1" stroke-dasharray="4,3"/>

  <circle cx="720" cy="430" r="14" fill="#14532D" stroke="#22C55E" stroke-width="1.5"/>
  <text x="720" y="435" text-anchor="middle" fill="#22C55E" font-size="12" font-weight="700">✓</text>
