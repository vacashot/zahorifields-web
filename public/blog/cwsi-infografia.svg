  <text x="532" y="210" text-anchor="middle" fill="#86EFAC" font-size="8">Leve</text>

  <rect x="575" y="158" width="75" height="60" rx="3" fill="#854D0E" opacity="0.85"/>
  <text x="612" y="183" text-anchor="middle" fill="#FDE68A" font-size="9" font-weight="600">CWSI</text>
