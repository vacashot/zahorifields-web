  <text x="452" y="249" text-anchor="middle" fill="#86EFAC" font-size="9" font-weight="600">CWSI</text>
  <text x="452" y="263" text-anchor="middle" fill="#DCFCE7" font-size="11" font-weight="700">0.22</text>
  <text x="452" y="276" text-anchor="middle" fill="#86EFAC" font-size="8">Sin estrés</text>

  <rect x="495" y="224" width="75" height="60" rx="3" fill="#854D0E" opacity="0.85"/>
  <text x="532" y="249" text-anchor="middle" fill="#FDE68A" font-size="9" font-weight="600">CWSI</text>
  <text x="532" y="263" text-anchor="middle" fill="#FEF3C7" font-size="11" font-weight="700">0.47</text>
  <text x="532" y="276" text-anchor="middle" fill="#FDE68A" font-size="8">Moderado</text>

  <rect x="575" y="224" width="75" height="60" rx="3" fill="#7C2D12" opacity="0.85"/>
  <text x="612" y="249" text-anchor="middle" fill="#FCA5A5" font-size="9" font-weight="600">CWSI</text>
  <text x="612" y="263" text-anchor="middle" fill="#FEE2E2" font-size="11" font-weight="700">0.73</text>
  <text x="612" y="276" text-anchor="middle" fill="#FCA5A5" font-size="8">Alto</text>

  <rect x="655" y="224" width="75" height="60" rx="3" fill="#450A0A" opacity="0.85"/>
  <text x="692" y="249" text-anchor="middle" fill="#FCA5A5" font-size="9" font-weight="600">CWSI</text>
  <text x="692" y="263" text-anchor="middle" fill="#FEE2E2" font-size="11" font-weight="700">0.91</text>
  <text x="692" y="276" text-anchor="middle" fill="#FCA5A5" font-size="8">Crítico</text>

  <g transform="translate(690, 300)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#22C55E" stroke-width="1.2"/>
    <line x1="-8" y1="-8" x2="-14" y2="-14" stroke="#22C55E" stroke-width="1"/>
    <line x1="8"  y1="-8" x2="14"  y2="-14" stroke="#22C55E" stroke-width="1"/>
    <line x1="-8" y1="8"  x2="-14" y2="14"  stroke="#22C55E" stroke-width="1"/>
    <line x1="8"  y1="8"  x2="14"  y2="14"  stroke="#22C55E" stroke-width="1"/>
    <circle cx="-14" cy="-14" r="3" fill="none" stroke="#22C55E" stroke-width="1"/>
    <circle cx="14"  cy="-14" r="3" fill="none" stroke="#22C55E" stroke-width="1"/>
    <circle cx="-14" cy="14"  r="3" fill="none" stroke="#22C55E" stroke-width="1"/>
    <circle cx="14"  cy="14"  r="3" fill="none" stroke="#22C55E" stroke-width="1"/>
