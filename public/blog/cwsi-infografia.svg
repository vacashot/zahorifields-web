  <line x1="690" y1="310" x2="650" y2="290" stroke="#22C55E" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.5"/>

  <rect x="60" y="378" width="680" height="122" rx="8" fill="#0D2820" stroke="#1E3B30" stroke-width="1"/>
  <text x="400" y="400" text-anchor="middle" fill="#5A8A70" font-size="10" letter-spacing="2">CÓMO SE CALCULA EN ZAHORIFIELDS</text>

