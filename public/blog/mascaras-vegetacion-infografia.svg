  <text x="400" y="68"  text-anchor="middle" fill="#E8F5E2" font-size="26" font-weight="700" letter-spacing="0.5">MÁSCARAS DE VEGETACIÓN</text>
  <text x="400" y="88"  text-anchor="middle" fill="#5A8A70" font-size="11" letter-spacing="1.5">Separar píxeles de cultivo del suelo y fondo · 4 estrategias</text>
  <line x1="60" y1="104" x2="740" y2="104" stroke="#1E3B30" stroke-width="1"/>

