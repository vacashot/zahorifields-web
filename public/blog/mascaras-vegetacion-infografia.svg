<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui,-apple-system,sans-serif">
  <title>Infografía Máscaras de Vegetación — 4 estrategias con ZahoriFields</title>
  <desc>Las 4 estrategias para crear máscaras de vegetación a partir de ortofotos de dron: índice espectral, color HSV, umbral térmico y método mixto</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F1F1A"/>
      <stop offset="100%" stop-color="#091610"/>
    </linearGradient>
    <linearGradient id="ndviGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7C2D12"/>
      <stop offset="35%"  stop-color="#D97706"/>
      <stop offset="60%"  stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="thermalGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1D4ED8"/>
      <stop offset="40%"  stop-color="#22C55E"/>
      <stop offset="70%"  stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <rect width="800" height="580" fill="url(#bg2)" rx="12"/>
