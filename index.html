  </head>
  <body>
    <div id="root">
      <!-- pantalla de carga -->
      <div id="splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8f7f4;z-index:9999">
        <img src="/images/zahorifields_dron_animado.svg" style="width:96px;height:auto" alt="Cargando ZahoriFields" />
        <p style="margin-top:16px;font-family:system-ui,sans-serif;font-size:12px;color:#888;letter-spacing:0.1em;text-transform:uppercase">Cargando…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Oculta el splash en cuanto React monta el árbol
      const observer = new MutationObserver(() => {
        const splash = document.getElementById('splash')
        if (splash && document.getElementById('root').children.length > 1) {
          splash.style.opacity = '0'
          splash.style.transition = 'opacity 0.4s'
          setTimeout(() => splash.remove(), 400)
          observer.disconnect()
        }
      })
      observer.observe(document.getElementById('root'), { childList: true })
    </script>
  </body>
